<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Check out a vehicle and calculate parking fee.">
  <title>Check Out — ParkEase</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar" id="main-nav"></nav>

  <div class="page-content">
    <div class="container">
      <div class="page-header">
        <h1>🏁 Check Out Vehicle</h1>
        <p>Search for a parked vehicle, calculate fee, and check out</p>
      </div>

      <!-- Search -->
      <div class="card mb-4">
        <div class="card-title" style="margin-bottom:16px;">Find Active Vehicle</div>
        <div class="search-bar">
          <input type="text" id="search-plate" class="form-input" placeholder="Search by plate number..." style="text-transform: uppercase;">
          <button class="btn btn-primary" onclick="searchActiveCars()" id="search-btn">🔍 Search</button>
        </div>
        <button class="btn btn-outline btn-sm" onclick="loadAllActive()">Show All Active Vehicles</button>
      </div>

      <!-- Active vehicles table -->
      <div id="active-vehicles" class="hidden">
        <div class="card">
          <div class="card-header">
            <div class="card-title">Active Vehicles</div>
          </div>
          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>Plate</th>
                  <th>Type</th>
                  <th>Spot</th>
                  <th>Level</th>
                  <th>Checked In</th>
                  <th>Duration</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="active-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Checkout Receipt -->
      <div id="checkout-receipt" class="hidden mt-4"></div>
    </div>
  </div>

  <!-- Confirmation Modal -->
  <div id="confirm-modal" class="modal-overlay hidden">
    <div class="modal">
      <h2>Confirm Check Out</h2>
      <p id="confirm-text"></p>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
        <button class="btn btn-success" id="confirm-checkout-btn" onclick="confirmCheckout()">✓ Check Out & Pay</button>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/checkout.js"></script>
</body>
</html>
